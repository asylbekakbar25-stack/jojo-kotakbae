<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJo Hardcore Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background: #111; 
            color: white; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 650px; 
            width: 100%;
            background: #222; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #e040fb; margin-top: 0; }
        .btn {
            background: #e040fb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background: #ab47bc; }
        .options { text-align: left; margin-top: 20px; }
        .option-btn {
            display: block;
            width: 100%;
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }
        .option-btn:hover { background: #444; }
    </style>
</head>
<body>

<div class="container" id="quiz-box">
    <h1>JoJo's Bizarre Adventure: Хардкор Тест</h1>
    <p id="question">Загрузка вопроса...</p>
    <div class="options" id="options"></div>
    <p id="score" style="margin-top: 20px; font-weight: bold;"></p>
</div>

<script>
    const quizData = [
        { q: "Как зовут собаку Донателло Версуса?", a: ["Дэнни", "Игги", "Харконнен", "У него нет собаки"], correct: 3 },
        { q: "Какой истинный предмет был запечатан внутри куба в Steel Ball Run?", a: ["Голова Святого Трупа", "Левая рука Святого Трупа", "Правый глаз", "Сердце"], correct: 1 },
        { q: "Как называется музыкальная группа, в честь которой назван стенд Sex Pistols?", a: ["Sex Pistols", "Guns N' Roses", "Aerosmith", "Kiss"], correct: 0 },
        { q: "Какое имя было у оригинальной личности Дьяволо в детстве?", a: ["Солидо Назо", "Венегар Доппио", "Дьяволо", "Нейтан"], correct: 0 },
        { q: "Какое блюдо Тонио Труссарди приготовил первым для Окуясу?", a: ["Спегетти Путтанеска", "Вода Water", "Капрезе с моцареллой", "Лампредотто"], correct: 1 },
        { q: "Какой номер у камеры, в которой сидел Джотаро в начале 3 части?", a: ["1", "3", "12", "7"], correct: 0 },
        { q: "Как называется способность стенда Whitesnake превращать людей и стенды в диски?", a: ["Disc Extraction", "Melt Your Heart", "Mind Steal", "Memory Disc"], correct: 0 },
        { q: "Сколько всего узлов на шарфе Цезаря Цеппели?", a: ["4", "7", "9", "Это не упоминалось точно"], correct: 3 },
        { q: "Какая болезнь была у матери Джони Джостара?", a: ["Простуда", "Она умерла от инфекции", "Бешенство", "Она не была больна"], correct: 1 },
        { q: "Какой породы был собака Игги?", a: ["Бостон-терьер", "Бульдог", "Мопс", "Терьер"], correct: 0 },
        { q: "Как называется книга комиксов Боинго?", a: ["Toth", "Oingo Boingo", "Khnum", "Anubis"], correct: 0 },
        { q: "Какой любимый напиток у Джозефа Джостара в молодости?", a: ["Кола", "Кофе", "Текила", "Чай"], correct: 0 },
        { q: "Какое полное имя у Джорно Джованны от рождения?", a: ["Харуно Shiota", "Харуно Шиобана", "Джорно Джованна", "Джорни Брандо"], correct: 1 },
        { q: "Как называется группа, создавшая песню 'Roundabout' (эндинг 1-2 частей)?", a: ["Yes", "Queen", "Deep Purple", "King Crimson"], correct: 0 },
        { q: "Сколько секунд мог останавливать время Дио после поглощения крови Джозефа?", a: ["5 секунд", "9 секунд", "11 секунд", "15 секунд"], correct: 1 }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        if (currentQ >= quizData.length) {
            document.getElementById("quiz-box").innerHTML = `
                <h1>Тест завершён!</h1>
                <p>Ваш результат: ${score} из ${quizData.length}</p>
                <button class="btn" onclick="location.reload()">Пройти снова</button>
            `;
            return;
        }

        const q = quizData[currentQ];
        document.getElementById("question").innerText = `${currentQ + 1}. ${q.q}`;
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        q.a.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === quizData[currentQ].correct) {
            score++;
        }
        currentQ++;
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
